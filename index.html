<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReelMitra.Ai - AI Reel Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <header class="text-center mb-8">
        <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-400 to-purple-500 mb-2">
            ReelMitra.Ai
        </h1>
        <p class="text-slate-400 text-sm md:text-base">1-क्लिक में हिंदी AI रील्स, स्क्रिप्ट और वॉयसओवर बनाएं</p>
    </header>

    <main class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6">
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                    रील का विषय (Topic)
                </label>
                <input 
                    type="text" 
                    id="topic" 
                    placeholder="उदा: AI से पैसे कमाने के 3 तरीके..." 
                    class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500"
                >
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                    वॉयस चुनें (Voice)
                </label>
                <select id="voice" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-cyan-500">
                    <option value="hi-IN-MadhurNeural">🇮🇳 Madhur (पुरुष आवाज)</option>
                    <option value="hi-IN-SwaraNeural">🇮🇳 Swara (महिला आवाज)</option>
                </select>
            </div>

            <button 
                id="generateBtn" 
                onclick="generateReel()" 
                class="w-full py-3.5 px-4 bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 font-bold rounded-xl shadow-lg transition flex items-center justify-center gap-2"
            >
                <i class="fas fa-magic"></i>
                <span>रील जनरेट करें (Generate Reel)</span>
            </button>
        </div>

        <div id="loader" class="hidden my-6 text-center">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-cyan-400 mb-2"></div>
            <p class="text-xs text-slate-400 animate-pulse">AI रील तैयार कर रहा है, कृपया प्रतीक्षा करें...</p>
        </div>

        <div id="resultBox" class="hidden mt-6 pt-6 border-t border-slate-800 space-y-4">
            <h3 class="font-bold text-sm text-cyan-400 flex items-center gap-2">
                <i class="fas fa-check-circle"></i> आपकी रील तैयार है!
            </h3>
            <div class="aspect-[9/16] max-h-96 w-full bg-black rounded-xl overflow-hidden border border-slate-800 flex items-center justify-center">
                <video id="reelVideo" controls class="w-full h-full object-cover"></video>
            </div>
            <a 
                id="downloadBtn" 
                href="#" 
                download="ReelMitra_Reel.mp4" 
                class="block text-center w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-medium text-xs text-slate-200 transition"
            >
                📥 रील डाउनलोड करें
            </a>
        </div>
    </main>

    <footer class="mt-8 text-center text-xs text-slate-600">
        ReelMitra.Ai • Developed with ❤️ by JP Mishra Digital
    </footer>

    <script>
        const BACKEND_URL = "https://reelmitra-ai.onrender.com";

        async function generateReel() {
            const topic = document.getElementById('topic').value.trim();
            const voice = document.getElementById('voice').value;
            const btn = document.getElementById('generateBtn');
            const loader = document.getElementById('loader');
            const resultBox = document.getElementById('resultBox');
            const video = document.getElementById('reelVideo');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!topic) {
                alert("कृपया पहले रील का विषय (Topic) दर्ज करें!");
                return;
            }

            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            loader.classList.remove('hidden');
            resultBox.classList.add('hidden');

            try {
                const response = await fetch(`${BACKEND_URL}/api/generate-reel`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic, voice })
                });

                const data = await response.json();

                if (data.success && data.videoUrl) {
                    video.src = data.videoUrl;
                    downloadBtn.href = data.videoUrl;
                    resultBox.classList.remove('hidden');
                } else {
                    alert("एरर: " + (data.message || "रील जनरेट नहीं हो सकी।"));
                }
            } catch (err) {
                alert("सर्वर से कनेक्ट नहीं हो सका। कृपया 30 सेकंड बाद दोबारा प्रयास करें (Render फ्री सर्वर स्टार्ट होने में समय ले सकता है)।");
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
          </html>
