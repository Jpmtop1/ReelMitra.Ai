<!DOCTYPE html>
<html lang="hi">
<head>
    < charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReelMitra.Ai - AI रील जनरेटर</title>
    <style>
        :root {
            --primary: #8a2be2;
            --primary-gradient: linear-gradient(135deg, #8a2be2, #4a00e0);
            --bg: #0d0f17;
            --card-bg: #1a1d2d;
            --text: #ffffff;
            --text-secondary: #a0aec0;
            --accent: #00f2fe;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(to right, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .credits-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.3);
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        input[type="text"], select {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: var(--text);
            font-size: 15px;
            outline: none;
        }

        input[type="text"]:focus, select:focus {
            border-color: #00f2fe;
        }

        .btn-generate {
            width: 100%;
            padding: 16px;
            background: var(--primary-gradient);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn-generate:active {
            transform: scale(0.98);
        }

        /* Loader */
        #loader {
            display: none;
            text-align: center;
            padding: 30px 0;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #00f2fe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Video Result Container */
        #resultBox {
            display: none;
            margin-top: 24px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .video-wrapper {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            margin-bottom: 16px;
            aspect-ratio: 9 / 16;
            max-height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        .btn-download {
            background: var(--success);
        }

        .btn-share {
            background: #25d366;
        }

        /* Recharge Modal */
        #rechargeModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-align: center;
        }

        .pack-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 10px;
            margin: 10px 0;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">ReelMitra.Ai</div>
            <div class="credits-badge" onclick="openRechargeModal()">
                ⚡ <span id="creditCount">20</span> क्रेडिट्स
            </div>
        </header>

        <!-- Form -->
        <div class="form-group">
            <label for="topic">🎯 रील का विषय या प्रॉम्प्ट लिखें:</label>
            <input type="text" id="topic" placeholder="उदा: श्री राम मंत्र और उसका महत्व...">
        </div>

        <div class="form-group">
            <label for="voice">🎙️ आवाज़ (Voiceover) चुनें:</label>
            <select id="voice">
                <option value="male1">गंभीर पुरुष आवाज़ (Hindi Male)</option>
                <option value="female1">मधुर महिला आवाज़ (Hindi Female)</option>
                <option value="energetic">ऊर्जावान मोटिवेशनल आवाज़</option>
            </select>
        </div>

        <button class="btn-generate" onclick="generateVideo()">🚀 AI रील जनरेट करें (10 क्रेडिट)</button>

        <!-- Loader -->
        <div id="loader">
            <div class="spinner"></div>
            <p style="font-size: 14px; color: #00f2fe;">AI आपकी रील बना रहा है... कृपया 2 सेकंड रुकें</p>
        </div>

        <!-- Result Box -->
        <div id="resultBox">
            <div class="video-wrapper">
                <video id="outputVideo" controls playsinline webkit-playsinline preload="metadata">
                    आपका ब्राउज़र वीडियो सपोर्ट नहीं करता।
                </video>
            </div>
            <div class="action-buttons">
                <a id="downloadBtn" class="btn-action btn-download" download="ReelMitra_Reel.mp4">📥 डाउनलोड करें</a>
                <button class="btn-action btn-share" onclick="shareToWhatsApp()">📲 व्हाट्सएप पर भेजें</button>
            </div>
        </div>
    </div>

    <!-- Recharge Modal -->
    <div id="rechargeModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 12px;">⚡ क्रेडिट रिचार्ज करें</h3>
            <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 16px;">1 रील = 10 क्रेडिट्स</p>

            <div class="pack-card" onclick="payUPI(99)">
                <strong>स्टार्टर पैक: ₹99</strong><br>
                <small style="color: #ffd700;">200 क्रेडिट्स (20 रील्स)</small>
            </div>

            <div class="pack-card" onclick="payUPI(249)">
                <strong>क्रिएटर पैक: ₹249</strong><br>
                <small style="color: #ffd700;">600 क्रेडिट्स (60 रील्स)</small>
            </div>

            <button class="btn-generate" style="background: rgba(255,255,255,0.1); margin-top: 15px;" onclick="closeRechargeModal()">बंद करें</button>
        </div>
    </div>

    <script>
        let credits = 20;

        function updateCreditsDisplay() {
            document.getElementById('creditCount').innerText = credits;
        }

        function generateVideo() {
            const topicInput = document.getElementById('topic');
            const topic = topicInput.value.trim();

            if (!topic) {
                alert("कृपया पहले रील का विषय लिखें!");
                topicInput.focus();
                return;
            }

            if (credits < 10) {
                alert("आपके पास पर्याप्त क्रेडिट नहीं हैं! कृपया रिचार्ज करें।");
                openRechargeModal();
                return;
            }

            // लोडर दिखाना और पुराना रिजल्ट छुपाना
            const loader = document.getElementById('loader');
            const resultBox = document.getElementById('resultBox');
            loader.style.display = 'block';
            resultBox.style.display = 'none';

            // 2.5 सेकंड का रियलिस्टिक AI जनरेशन डिले
            setTimeout(() => {
                // क्रेडिट्स काटना
                credits -= 10;
                updateCreditsDisplay();

                loader.style.display = 'none';
                resultBox.style.display = 'block';

                // 100% वर्किंग और ओपन Google Cloud CDN MP4 लिंक (नो ब्रोकन मीडिया)
                const workingVideoUrl = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";

                const videoPlayer = document.getElementById('outputVideo');
                videoPlayer.src = workingVideoUrl;
                videoPlayer.load();

                // ऑटोप्ले चलाने की कोशिश (मोबाइल पर यूजर फ्रेंडली)
                videoPlayer.play().catch(err => {
                    console.log("Autoplay blocked by browser, user will press play:", err);
                });

                // डाउनलोड बटन अपडेट करना
                const downloadBtn = document.getElementById('downloadBtn');
                downloadBtn.href = workingVideoUrl;

            }, 2500);
        }

        function shareToWhatsApp() {
            const topic = document.getElementById('topic').value || "AI Reel";
            const text = encodeURIComponent(`नमस्ते! मैंने ReelMitra.Ai से "${topic}" पर रील बनाई है। आप भी अपनी रील फ्री में बनाइए!`);
            window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
        }

        function openRechargeModal() {
            document.getElementById('rechargeModal').style.display = 'flex';
        }

        function closeRechargeModal() {
            document.getElementById('rechargeModal').style.display = 'none';
        }

        function payUPI(amount) {
            alert(`UPI पेमेंट सिस्टम: ₹${amount} का पेमेंट लिंक खुल रहा है...`);
            // यहाँ बाद में आपका UPI VPA लिंक जुड़ जाएगा
        }
    </script>
</body>
</html>
